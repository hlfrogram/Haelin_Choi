<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e5db">
<title>나와 닮은 철학자 찾기</title>
<meta name="description" content="열두 가지 상황에서 고른 답으로, 서른두 명의 철학자 중 나와 가장 닮은 한 사람을 찾아봅니다.">
<style>
:root {
  --page: #e9e5db; --ink: #1a1915; --gold: #c09a55; --gold-btn: #dbb871; --cream: #f5efe2;
  --muted: rgba(245, 239, 226, .62); --line: rgba(192, 154, 85, .5);
  --serif: "Nanum Myeongjo", "Noto Serif KR", "Noto Serif CJK KR", "AppleMyungjo", "Batang", serif;
  --sans: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--sans); -webkit-text-size-adjust: 100%;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
button { font-family: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.stage { max-width: 460px; margin: 0 auto; padding: 14px 12px 40px; }
.card { --n: 15px; position: relative; color: var(--cream); border: 7px solid var(--gold); padding: 30px 22px;
  background-origin: border-box; background-clip: border-box;
  background:
    radial-gradient(circle at 0 0, var(--page) 0 var(--n), var(--gold) var(--n) calc(var(--n) + 3px), transparent calc(var(--n) + 3px)) top left / 44px 44px no-repeat,
    radial-gradient(circle at 100% 0, var(--page) 0 var(--n), var(--gold) var(--n) calc(var(--n) + 3px), transparent calc(var(--n) + 3px)) top right / 44px 44px no-repeat,
    radial-gradient(circle at 0 100%, var(--page) 0 var(--n), var(--gold) var(--n) calc(var(--n) + 3px), transparent calc(var(--n) + 3px)) bottom left / 44px 44px no-repeat,
    radial-gradient(circle at 100% 100%, var(--page) 0 var(--n), var(--gold) var(--n) calc(var(--n) + 3px), transparent calc(var(--n) + 3px)) bottom right / 44px 44px no-repeat,
    var(--ink); }
.card, .modal p, .toast { word-break: keep-all; overflow-wrap: break-word; }
.card + .card { margin-top: 18px; }
.rule { height: 1px; background: var(--line); margin: 18px 0; border: 0; }
.serif { font-family: var(--serif); }

/* 시작 화면 */
.start { text-align: center; padding-top: 38px; }
.kicker { margin: 0 0 14px; color: var(--muted); font-size: 14px; letter-spacing: .04em; }
.title { margin: 0; font-family: var(--serif); font-weight: 800; line-height: 1.12; }
.title .gold { display: block; color: var(--gold); font-size: clamp(32px, 9.5vw, 44px); }
.title .main { display: block; color: var(--cream); font-size: clamp(46px, 14vw, 62px); }
.lead { margin: 0; font-size: 17px; }
.note { margin: 22px 0 6px; font-size: 17px; font-weight: 700; line-height: 1.5; }
.meta { margin: 0; color: var(--muted); font-size: 14px; }
.btn-gold { display: block; width: 100%; margin-top: 18px; padding: 18px; border: 0; border-radius: 4px; cursor: pointer;
  background: var(--gold-btn); color: var(--ink); font-size: 22px; font-weight: 800;
  box-shadow: 0 5px 0 #8a6f3c, 0 12px 24px rgba(0, 0, 0, .16); }
.btn-gold:active { transform: translateY(2px); box-shadow: 0 3px 0 #8a6f3c; }
.link { display: block; margin: 18px 2px 0; padding: 4px 0; border: 0; background: none; color: #6f6a5c; font-size: 14px;
  text-decoration: underline; cursor: pointer; }

/* 질문 화면 */
.quiz { display: flex; flex-direction: column; min-height: calc(100vh - 30px); min-height: calc(100dvh - 30px); }
.q-meta { display: flex; justify-content: space-between; color: var(--gold-btn); font-size: 14px; letter-spacing: .06em; }
.q-title { margin: 8px 0 0; color: var(--gold); font-family: var(--serif); font-size: 32px; line-height: 1.2; }
.q-text { margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 700; line-height: 1.6; }
.q-prompt { margin: 14px 0 0; color: var(--muted); font-size: 16px; }
.spacer { flex: 1; min-height: 24px; }
.timer { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; color: var(--gold-btn); font-size: 14px; }
.timer .bar { flex: 1; height: 3px; background: rgba(192, 154, 85, .25); }
.timer .bar i { display: block; height: 100%; width: 100%; background: var(--gold-btn); }
.options { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.options li { border-bottom: 1px solid var(--line); }
.options button { display: block; width: 100%; padding: 18px 4px; border: 0; background: none; text-align: left; cursor: pointer;
  color: var(--cream); font-family: var(--serif); font-size: 18px; line-height: 1.5; }
.options button:focus-visible, .btn-gold:focus-visible, .link:focus-visible { outline: 2px solid var(--gold-btn); outline-offset: 2px; }
.options .no { margin-right: 10px; color: var(--gold); }

/* 모달·토스트 */
.modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: rgba(26, 25, 21, .6); }
.modal .card { width: 100%; max-width: 420px; }
.modal h2 { margin: 0 0 12px; color: var(--gold); font-family: var(--serif); font-size: 24px; }
.modal p { margin: 0 0 12px; font-size: 15px; line-height: 1.6; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: 90vw;
  transform: translateX(-50%); padding: 12px 18px; background: var(--ink); color: var(--cream); border: 1px solid var(--gold);
  border-radius: 4px; font-size: 15px; word-break: break-all; }

/* 결과 화면 */
.hero { text-align: center; }
.result-name { margin: 0; font-family: var(--serif); font-size: clamp(38px, 11vw, 52px); font-weight: 800; line-height: 1.15; }
.match-pct { margin: 0; color: var(--gold-btn); font-size: 22px; font-weight: 800; }
.result-years { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.result-quote { margin: 4px 0 8px; font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.55; }
.result-tagline { margin: 0; color: var(--muted); font-size: 15px; }
.emblem { display: block; width: 64%; max-width: 260px; margin: 22px auto 0; }
.btn-dark { display: block; width: 100%; margin-top: 18px; padding: 17px; border: 0; background: var(--ink); color: var(--cream);
  font-size: 17px; font-weight: 800; cursor: pointer; }
.btn-row { display: flex; gap: 10px; margin-top: 10px; }
.btn-line { flex: 1; padding: 15px 8px; border: 2px solid var(--ink); background: transparent; color: var(--ink);
  font-size: 16px; font-weight: 700; cursor: pointer; }
.btn-dark:focus-visible, .btn-line:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn-row + .card { margin-top: 22px; }
.h { margin: 26px 0 10px; color: var(--gold); font-family: var(--serif); font-size: 24px; }
.h:first-child { margin-top: 0; }
.bio, .work { margin: 0; font-family: var(--serif); font-size: 17px; line-height: 1.7; }
.thoughts { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.side { color: var(--muted); font-size: 15px; }
.side.right { text-align: right; }
.side.on { color: var(--cream); font-weight: 800; }
.dots { display: flex; gap: 18px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: #3b3426; }
.dot.me { background: var(--gold-btn); }
.dot.phil { box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--cream); }
.legend { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; color: var(--muted); font-size: 14px; }
.key { display: inline-block; width: 12px; height: 12px; margin-left: 6px; border-radius: 50%; background: #3b3426; }
.key.me { background: var(--gold-btn); }
.key.phil { box-shadow: 0 0 0 2px var(--cream); }
.minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mini { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.mini .emblem { width: 100%; max-width: none; margin: 0 0 8px; }
.mini .label { color: var(--muted); font-size: 12px; }
.mini .name { font-family: var(--serif); font-size: 17px; font-weight: 800; line-height: 1.3; }
.mini .pct { color: var(--gold-btn); font-size: 14px; }
.critique { margin: 22px 0 0; font-family: var(--serif); font-size: 20px; font-weight: 700; line-height: 1.55; }
.critique-by { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

/* 친구 비교 */
.invite { margin: 16px 0 0; padding: 12px 10px; border: 1px solid var(--line); color: var(--gold-btn); font-size: 14px; line-height: 1.6; }
.compare-pct { margin: 0; color: var(--gold-btn); font-family: var(--serif); font-size: 26px; font-weight: 800; }
.compare-sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; }

/* 안내 문구·관리자 */
.notice { margin: 4px 2px 0; color: #8a8576; font-size: 12px; }
.admin-bar { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.admin-link { padding: 4px 2px; border: 0; background: none; color: #8a8576; font-size: 12px; text-decoration: underline; cursor: pointer; }
.pw { width: 100%; margin: 6px 0 4px; padding: 14px; border: 1px solid var(--line); background: #0f0e0b; color: var(--cream); font-size: 17px; }
.pw:focus-visible { outline: 2px solid var(--gold-btn); outline-offset: 1px; }
.err { margin: 8px 0 0; color: #e3a089; font-size: 14px; }
.stage.admin { max-width: 760px; }
.admin-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.admin-top .h { margin: 0; }
.admin-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-btn { padding: 8px 10px; border: 1px solid var(--gold); background: transparent; color: var(--cream); font-size: 13px; cursor: pointer; }
.mini-btn:disabled { opacity: .4; cursor: default; }
.mini-btn:focus-visible { outline: 2px solid var(--gold-btn); outline-offset: 2px; }
.admin-loading, .admin-error, .truncated, .note-small { margin: 18px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
.admin-error { color: #e3a089; }
.truncated { color: var(--gold-btn); }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 18px; }
.stat { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--line); }
.stat .k { color: var(--muted); font-size: 13px; }
.stat .v { color: var(--gold-btn); font-family: var(--serif); font-size: 24px; font-weight: 800; }
.bar-row { display: grid; grid-template-columns: minmax(70px, 38%) 1fr auto; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; }
.bar-row .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 10px; background: rgba(192, 154, 85, .15); }
.bar-row .track i { display: block; height: 100%; background: var(--gold-btn); }
.bar-row .val { min-width: 64px; text-align: right; color: var(--muted); font-size: 13px; }
.q-block { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); }
.q-block h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 17px; }
.q-block small { color: var(--muted); font-family: var(--sans); font-size: 12px; font-weight: 400; }
.q-missing { margin: 6px 0 0; color: var(--gold-btn); font-size: 13px; }

/* 타이머: 숫자를 크게, 마지막 3초는 붉게 */
.timer { gap: 14px; margin-bottom: 12px; font-size: 14px; }
.timer .bar { height: 10px; border-radius: 5px; overflow: hidden; background: rgba(192, 154, 85, .22); }
.timer .bar i { border-radius: 5px; transition: background .2s; }
.timer .sec { display: flex; align-items: baseline; justify-content: flex-end; gap: 2px; min-width: 70px; }
.timer .sec .n { font-family: var(--serif); font-size: 54px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; display: inline-block; }
.timer .sec small { font-size: 16px; font-weight: 700; }
.timer.urgent { color: #ff8a70; }
.timer.urgent .bar i { background: #ff8a70; }
.timer.urgent .n { animation: tick-pulse 1s ease-in-out infinite; }
@keyframes tick-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
@media (prefers-reduced-motion: reduce) { .timer.urgent .n { animation: none; } }

/* 철학자 이미지, 더보기, 공개 분포 */
.portrait { object-fit: cover; aspect-ratio: 1 / 1; background: #14130f; }
.more-link { display: inline-block; margin-top: 12px; color: var(--gold-btn); font-size: 15px; font-weight: 700; text-decoration: underline; }
.btn-line.wide { display: block; width: 100%; margin-top: 10px; }
.public-total { margin: 18px 0 8px; font-size: 16px; }
.public-total b { color: var(--gold-btn); font-family: var(--serif); font-size: 22px; }
.public-empty { margin: 22px 0 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.bar-row.mine .lab, .bar-row.mine .val { color: var(--cream); font-weight: 800; }
.bar-row.mine .track i { background: var(--cream); }

/* 다음으로 이동 버튼, 선택 표시, 오류 정보 */
.btn-gold:disabled { opacity: .35; box-shadow: none; cursor: default; transform: none; }
.options button.selected { background: rgba(192, 154, 85, .16); box-shadow: inset 4px 0 0 var(--gold-btn); }
.options button.selected .no { color: var(--gold-btn); }
.error-detail { margin: 6px 0 0; color: var(--muted); font-size: 12px; }

/* 4차: 결과 화면 버튼 배치, 정반대 철학자, 다시 하기 */
.actions { margin-top: 18px; }
.actions .btn-gold { margin-top: 0; }
.actions .btn-dark { margin-top: 12px; }
.actions .btn-line.wide { margin-top: 12px; }
.actions + .card { margin-top: 36px; }
.minis.two { grid-template-columns: repeat(2, 1fr); }
.opposite { margin-top: 26px; padding: 18px 16px 16px; border: 2px solid var(--accent); background: rgba(229, 138, 108, .08); --accent: #e58a6c; }
.opposite .opp-label { margin: 0 0 12px; color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
.opp-body { display: flex; align-items: center; gap: 14px; }
.opp-body .portrait, .opp-body .emblem { width: 88px; max-width: 88px; margin: 0; flex: none; border: 2px solid var(--accent); }
.opp-info { display: flex; flex-direction: column; gap: 2px; }
.opp-info .name { font-family: var(--serif); font-size: 22px; font-weight: 800; }
.opp-info .pct { color: var(--accent); font-size: 14px; }
.opposite .critique { margin-top: 16px; font-size: 19px; }
.opposite .critique-by { color: var(--accent); }
.retry-zone { margin-top: 34px; padding-top: 22px; border-top: 1px solid rgba(26, 25, 21, .2); }
.retry-zone .btn-line { margin-top: 0; }


/* 개인정보 처리방침 */
.modal .policy { max-height: calc(100dvh - 40px); overflow-y: auto; }
.policy h3 { margin: 18px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--gold-btn); font-size: 15px; }
.policy .policy-lead { padding: 10px 12px; margin: 0 0 4px; border-left: 3px solid var(--gold); background: rgba(192, 154, 85, .1); }
.policy ul { margin: 0 0 12px; padding-left: 20px; font-size: 15px; line-height: 1.7; }
.policy li { margin: 2px 0; }
.policy-date { margin-top: 16px; color: var(--muted); font-size: 13px; }

/* 관리자: 꺾은선 그래프, 철학자 줄, 상세 */
.daily { margin-top: 6px; }
.line-chart { display: block; width: 100%; height: auto; }
.line-chart .grid { stroke: rgba(192, 154, 85, .18); stroke-width: 1; }
.line-chart .ln { stroke: var(--gold-btn); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.line-chart .pt { fill: var(--ink); stroke: var(--gold-btn); stroke-width: 2.5; }
.line-chart text { fill: var(--muted); font-size: 12px; font-family: var(--sans); }
.line-chart .vlab { fill: var(--cream); font-weight: 700; }
.bar-row.p-row { grid-template-columns: minmax(70px, 30%) 1fr auto auto; }
.detail-btn { padding: 5px 9px; font-size: 12px; white-space: nowrap; }
.detail-title { font-size: 21px; }
.detail-total { margin: 16px 0 0; font-size: 15px; }
.detail-total b { color: var(--gold-btn); font-family: var(--serif); font-size: 22px; }
.detail-empty { margin: 20px 0 0; color: var(--muted); font-size: 15px; }

/* 다음 버튼: 비활성일 때도 투명하지 않게(뒤의 보기 글자가 비치지 않도록) */
.btn-gold.next:disabled { opacity: 1; background: #5b5039; color: rgba(245, 239, 226, .5); }
.credit { margin: 6px 2px 0; color: #8a8576; font-size: 12px; line-height: 1.5; }

/* 철학자 사진: 저장 카드와 같게 원형 + 금색 테두리 */
.portrait { border-radius: 50%; border: 5px solid var(--gold); background: #14130f; }
.mini .portrait { border-width: 3px; }
.opp-body .portrait { border: 3px solid var(--accent); }
.card .participants, .start .participants { color: var(--gold); }
.card .participants b { color: var(--gold-btn); }

/* 5차: 참여자 수, 이전 버튼, 키보드 안내 */
.participants { margin: 8px 0 0; min-height: 1.5em; color: var(--gold); font-size: 14px; }
.participants b { color: var(--gold-btn); font-weight: 700; }
.card .participants, .start .participants { color: var(--gold); }
.card .participants b { color: var(--gold-btn); }
/* 아래쪽 고정 줄: [이전] [다음으로 이동] */
.nav-row { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 2; display: flex; gap: 10px; margin-top: 14px; background: var(--ink); box-shadow: 0 0 0 10px var(--ink); }
.nav-row .btn-gold.next { flex: 1; width: auto; margin-top: 0; box-shadow: 0 5px 0 #8a6f3c; }
.nav-row .btn-gold.next:disabled { box-shadow: none; }
.back-btn { flex: none; width: 62px; display: flex; align-items: center; justify-content: center; padding: 0; border: 2px solid var(--gold); border-radius: 4px;
  background: transparent; color: var(--gold-btn); cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.back-btn:active { background: rgba(192, 154, 85, .18); transform: translateY(2px); }
.back-btn:focus-visible { outline: 3px solid var(--gold-btn); outline-offset: 2px; }
.kbd-hint { display: none; margin: 10px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
@media (hover: hover) and (pointer: fine) { .kbd-hint { display: block; } }

/* 6차: 문항 강조, 시작 화면 카뮈 사진, 연구 목적 안내 */
.hl { color: #f0cf86; font-weight: 800; box-shadow: inset 0 -0.38em 0 rgba(192, 154, 85, .3); }
.start-photo { display: block; width: auto; max-width: 100%; height: auto; max-height: 340px; margin: 26px auto 0; object-fit: contain; }
.start-photo.empty { width: 100%; height: 220px; background: rgba(192, 154, 85, .06); box-shadow: inset 0 0 0 1px rgba(192, 154, 85, .25); }
.purpose { margin: 14px 0 0; padding: 9px 12px; border-left: 3px solid var(--gold); background: rgba(192, 154, 85, .09); color: rgba(245, 239, 226, .82); font-size: 13px; line-height: 1.6; text-align: left; }

/* 개발자의 의견 */
.dev-note { margin-top: 22px; }
.dev-note .dev-lead { margin: 0 0 4px; font-size: 15px; line-height: 1.6; }
.dev-note .btn-line { margin-top: 12px; }
.modal .rebuttal { max-height: calc(100dvh - 40px); overflow-y: auto; }
.modal .rebuttal p { font-size: 16px; line-height: 1.8; }
.modal .rebuttal .rebuttal-kicker { margin: 0 0 4px; color: var(--muted); font-size: 13px; letter-spacing: .08em; }
.modal .rebuttal .btn-gold { margin-top: 8px; }
.dev-note .btn-line { border-color: var(--gold); color: var(--cream); background: rgba(192, 154, 85, .12); }

/* 결과 화면 스크롤 유도: 흔들흔들(쉬고)흔들흔들 */
.scroll-cue { position: fixed; right: 14px; bottom: 14px; z-index: 5; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gold); background: rgba(26, 22, 18, .92); color: var(--gold); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
.scroll-cue.still { animation: none; }
.stage.nudge { animation: page-wiggle 3.6s ease-in-out infinite; }
@keyframes page-wiggle {
  0%, 36%, 100% { transform: translateY(0); }
  6% { transform: translateY(-6px); }
  12% { transform: translateY(2px); }
  18% { transform: translateY(-6px); }
  24% { transform: translateY(2px); }
  30% { transform: translateY(-3px); }
}
@media (prefers-reduced-motion: reduce) { .stage.nudge { animation: none; } }

/* 맨 위로 버튼 */

// 핵심 로직: 점수, 거리, 순위, 답안 코드. 순수 함수만 둔다.
const AXES = ['A', 'B', 'C', 'D', 'E'];
const MAX_DISTANCE = Math.sqrt(80);

function scoreAnswers(answers, questions) {
  return AXES.map((axis) => {
    let sum = 0;
    let count = 0;
    questions.forEach((question, i) => {
      const choice = answers[i];
      if (choice === null || choice === undefined) return;
      const option = question.options[choice];
      if (!option || typeof option.effects[axis] !== 'number') return;
      sum += option.effects[axis];
      count += 1;
    });
    const value = count === 0 ? 3 : 3 + sum / count;
    return Math.min(5, Math.max(1, value));
  });
}

function distance(a, b) {
  let total = 0;
  for (let i = 0; i < a.length; i += 1) total += (a[i] - b[i]) ** 2;
  return Math.sqrt(total);
}

function matchPercent(a, b) {
  const pct = Math.round(100 * (1 - distance(a, b) / MAX_DISTANCE));
  return Math.min(100, Math.max(0, pct));
}

function rankPhilosophers(userVec, list) {
  const rows = list.map((p) => ({
    p,
    d: Math.round(distance(userVec, p.vector) * 1e9) / 1e9,
    a: Math.abs(userVec[0] - p.vector[0]),
    b: Math.abs(userVec[1] - p.vector[1]),
    c: Math.abs(userVec[2] - p.vector[2]),
  }));
  rows.sort((x, y) => x.d - y.d || x.a - y.a || x.b - y.b || x.c - y.c);
  const percent = {};
  rows.forEach((r) => { percent[r.p.id] = matchPercent(userVec, r.p.vector); });
  // 정반대: 내 점수를 3 기준으로 뒤집은 점(6-점수)에 가장 가까운 철학자. 최고 매칭과는 겹치지 않게 한다.
  const mirror = userVec.map((x) => 6 - x);
  const opp = list
    .filter((p) => p.id !== rows[0].p.id)
    .map((p) => ({ p, d: Math.round(distance(mirror, p.vector) * 1e9) / 1e9 }))
    .sort((x, y) => x.d - y.d)[0].p;
  return {
    best: rows[0].p,
    similar: [rows[1].p, rows[2].p],
    opposite: opp,
    percent,
  };
}

function encodeAnswers(answers) {
  return answers.map((a) => (a === null || a === undefined ? '-' : String(a))).join('');
}

function decodeAnswers(s) {
  if (typeof s !== 'string' || !/^[0-3-]{12}$/.test(s)) return null;
  return [...s].map((ch) => (ch === '-' ? null : Number(ch)));
}

if (typeof module !== 'undefined') {
  module.exports = {
    AXES, MAX_DISTANCE, scoreAnswers, distance, matchPercent,
    rankPhilosophers, encodeAnswers, decodeAnswers,
  };
}

// 통계: 전송 데이터 만들기, 집계, CSV. 순수 함수만 둔다.
const _statsCore = (typeof module !== 'undefined') ? require('./core.js') : { encodeAnswers };
const DB_ANSWERS = /^[0-3]{2}[0-3-][0-3]{7}[0-3-][0-3]$/;
const KST_MS = 9 * 3600 * 1000;
const DAY_MS = 86400000;
const CIRCLED = ['①', '②', '③', '④'];

const kstIso = (ms) => new Date(ms + KST_MS).toISOString();
const kstDay = (ms) => kstIso(ms).slice(0, 10);
const kstDateTime = (ms) => kstIso(ms).slice(0, 19).replace('T', ' ');
const pct = (n, d) => (d ? Math.round((n / d) * 1000) / 10 : '');
const countDash = (s) => (s.match(/-/g) || []).length;

function buildPayload(answers, result, fromFriend) {
  if (!Array.isArray(answers) || answers.length !== 12) return null;
  const code = _statsCore.encodeAnswers(answers);
  if (!DB_ANSWERS.test(code)) return null;
  const best = result.ranking.best;
  const v = result.vector.map((x) => Math.round(x * 100) / 100);
  return {
    answers: code,
    philosopher_id: best.id,
    match_percent: result.ranking.percent[best.id],
    axis_a: v[0], axis_b: v[1], axis_c: v[2], axis_d: v[3], axis_e: v[4],
    from_friend: Boolean(fromFriend),
  };
}

function aggregate(rows, now, philosophers, questions) {
  const todayStr = kstDay(now);
  const weekStart = kstDay(now - 6 * DAY_MS);
  const perDay = {};
  let today = 0;
  let last7 = 0;
  let matchSum = 0;
  let friendCount = 0;
  let timeoutAny = 0;
  let timeoutBoth = 0;
  const byId = {};
  const qstats = questions.map(() => ({ counts: [0, 0, 0, 0], answered: 0, missing: 0 }));

  rows.forEach((r) => {
    const day = kstDay(Date.parse(r.created_at));
    perDay[day] = (perDay[day] || 0) + 1;
    if (day === todayStr) today += 1;
    if (day >= weekStart && day <= todayStr) last7 += 1;
    matchSum += Number(r.match_percent) || 0;
    if (r.from_friend) friendCount += 1;
    byId[r.philosopher_id] = (byId[r.philosopher_id] || 0) + 1;
    const code = typeof r.answers === 'string' ? r.answers : '';
    if (code.length !== questions.length) return;
    const missing = countDash(code);
    if (missing >= 1) timeoutAny += 1;
    if (missing === 2) timeoutBoth += 1;
    [...code].forEach((ch, i) => {
      if (ch === '-') qstats[i].missing += 1;
      else if (ch >= '0' && ch <= '3') { qstats[i].counts[Number(ch)] += 1; qstats[i].answered += 1; }
    });
  });

  const daily = [];
  for (let i = 13; i >= 0; i -= 1) {
    const date = kstDay(now - i * DAY_MS);
    daily.push({ date, count: perDay[date] || 0 });
  }
  const byPhilosopher = philosophers
    .map((p, order) => ({ id: p.id, name: p.name, count: byId[p.id] || 0, order }))
    .sort((a, b) => b.count - a.count || a.order - b.order)
    .map(({ id, name, count }) => ({ id, name, count }));

  return {
    total: rows.length, today, last7, daily,
    avgMatch: rows.length ? Math.round((matchSum / rows.length) * 10) / 10 : null,
    friendCount, timeoutAny, timeoutBoth, byPhilosopher, questions: qstats,
  };
}

function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const csvLine = (cells) => cells.map(csvEscape).join(',');

function toRawCsv(rows, philosophers) {
  const names = {};
  philosophers.forEach((p) => { names[p.id] = p.name; });
  const header = ['시각(한국시간)', '철학자id', '철학자', '일치율', '축A', '축B', '축C', '축D', '축E', '친구링크', '시간초과수'];
  for (let i = 1; i <= 12; i += 1) header.push('q' + i);
  const lines = [csvLine(header)];
  rows.forEach((r) => {
    const code = typeof r.answers === 'string' ? r.answers : '';
    const qs = [...code.padEnd(12, ' ').slice(0, 12)].map((ch) => (ch >= '0' && ch <= '3' ? String(Number(ch) + 1) : ''));
    lines.push(csvLine([
      kstDateTime(Date.parse(r.created_at)), r.philosopher_id, names[r.philosopher_id] || r.philosopher_id, r.match_percent,
      r.axis_a, r.axis_b, r.axis_c, r.axis_d, r.axis_e, r.from_friend ? 'Y' : 'N', countDash(code), ...qs,
    ]));
  });
  return '\uFEFF' + lines.join('\r\n');
}

function toSummaryCsv(stats, questions) {
  const t = stats.total;
  const lines = [['구분', '항목', '라벨', '건수', '비율(%)', '분모']];
  lines.push(['전체', '전체 참여', '', t, '', '']);
  lines.push(['전체', '오늘', '', stats.today, pct(stats.today, t), t]);
  lines.push(['전체', '최근 7일', '', stats.last7, pct(stats.last7, t), t]);
  lines.push(['전체', '평균 일치율', '', '', stats.avgMatch === null ? '' : stats.avgMatch, t]);
  lines.push(['전체', '친구 링크 유입', '', stats.friendCount, pct(stats.friendCount, t), t]);
  lines.push(['전체', '시간 초과 1개 이상', '', stats.timeoutAny, pct(stats.timeoutAny, t), t]);
  lines.push(['전체', '시간 초과 2개', '', stats.timeoutBoth, pct(stats.timeoutBoth, t), t]);
  stats.byPhilosopher.forEach((p) => lines.push(['철학자', p.id, p.name, p.count, pct(p.count, t), t]));
  questions.forEach((q, i) => {
    const s = stats.questions[i];
    q.options.forEach((o, j) => lines.push(['문항', 'q' + (i + 1), q.title + ' / ' + CIRCLED[j] + ' ' + o.text, s.counts[j], pct(s.counts[j], s.answered), s.answered]));
    if (q.timed) lines.push(['문항', 'q' + (i + 1), q.title + ' / 시간 초과', s.missing, pct(s.missing, t), t]);
  });
  return '\uFEFF' + lines.map(csvLine).join('\r\n');
}

// 철학자별 상세 CSV: 그 철학자가 나온 사람들의 문항별 선택 비율(분모는 그 문항 응답자, 시간 초과는 그 철학자 인원 기준)
function toGroupCsv(name, stats, questions, allTotal) {
  const t = stats.total;
  const lines = [['구분', '항목', '라벨', '건수', '비율(%)', '분모']];
  lines.push(['철학자', '결과 인원', name, t, pct(t, allTotal), allTotal]);
  questions.forEach((q, i) => {
    const s = stats.questions[i];
    q.options.forEach((o, j) => lines.push(['문항', 'q' + (i + 1), q.title + ' / ' + CIRCLED[j] + ' ' + o.text, s.counts[j], pct(s.counts[j], s.answered), s.answered]));
    if (q.timed) lines.push(['문항', 'q' + (i + 1), q.title + ' / 시간 초과', s.missing, pct(s.missing, t), t]);
  });
  return '\uFEFF' + lines.map(csvLine).join('\r\n');
}

// 공개 분포: [{philosopher_id, count}] → 32명 전체를 많은 순으로
function publicDistribution(rows, philosophers) {
  const byId = {};
  rows.forEach((r) => { byId[r.philosopher_id] = (byId[r.philosopher_id] || 0) + (Number(r.count) || 0); });
  const list = philosophers
    .map((p, order) => ({ id: p.id, name: p.name, count: byId[p.id] || 0, order }))
    .sort((a, b) => b.count - a.count || a.order - b.order)
    .map(({ id, name, count }) => ({ id, name, count }));
  return { total: list.reduce((n, x) => n + x.count, 0), list };
}

if (typeof module !== 'undefined') module.exports = { buildPayload, aggregate, toRawCsv, toSummaryCsv, toGroupCsv, csvEscape, publicDistribution };

const ROW_COLUMNS = 'created_at,answers,philosopher_id,match_percent,axis_a,axis_b,axis_c,axis_d,axis_e,from_friend,timeout_count';

// 새 형식 키(sb_...)는 JWT가 아니라서 apikey 헤더에만 넣는다. (Authorization에 넣으면 Invalid JWT로 거부됨)
// 예전 JWT 형식 anon 키는 Authorization에도 넣는다.
function restHeaders(cfg) {
  const key = cfg.SUPABASE_ANON_KEY;
  return key.startsWith('sb_') ? { apikey: key } : { apikey: key, Authorization: 'Bearer ' + key };
}

async function submitResult(payload, cfg, fetchFn, delayFn) {
  const delay = delayFn || ((ms) => new Promise((resolve) => setTimeout(resolve, ms)));
  const attempt = async () => {
    let res;
    try {
      res = await fetchFn(cfg.SUPABASE_URL + '/rest/v1/results', {
        method: 'POST',
        headers: { ...restHeaders(cfg), 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify(payload),
      });
    } catch (e) {
      return { ok: false, retry: true };
    }
    if (res.ok) return { ok: true };
    return { ok: false, retry: res.status >= 500 || res.status === 429 };
  };
  let r = await attempt();
  if (r.ok) return true;
  if (!r.retry) return false;
  await delay(2000);
  r = await attempt();
  return r.ok;
}

async function adminLogin(password, cfg, fetchFn) {
  const res = await fetchFn(cfg.SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { apikey: cfg.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: cfg.ADMIN_EMAIL, password }),
  });
  if (!res.ok) throw new Error('login failed');
  const data = await res.json();
  if (!data || !data.access_token) throw new Error('login failed');
  return data.access_token;
}

// 실패한 응답에서 상태 코드와 Supabase 오류 코드를 꺼내 오류로 만든다.
async function failure(res) {
  let body = {};
  try { body = await res.json(); } catch (e) { body = {}; }
  const err = new Error((body && body.message) || 'request failed');
  err.status = res.status;
  err.code = (body && body.code) || '';
  return err;
}

  const pageSize = (opts && opts.pageSize) || 1000;

  let from = 0;
  while (rows.length < maxRows) {
    const res = await fetchFn(cfg.SUPABASE_URL + '/rest/v1/results?select=' + ROW_COLUMNS + '&order=created_at.desc', {
      headers: {
        apikey: cfg.SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + token,
        'Range-Unit': 'items',
        Range: from + '-' + (from + pageSize - 1),
      },
    });
    if (!res.ok) throw await failure(res);
    const page = await res.json();
    rows.push(...page);
    if (page.length < pageSize) return { rows, truncated: false };
    from += pageSize;
  }
  return { rows, truncated: true };
}

// 경과 시간 기준 카운트다운. now()와 시작 시각의 차로 계산하므로 탭이 백그라운드에 있어도 정확하다.
function createTimer(durationMs, now, onTick, onExpire) {
  let startAt = 0;
  let active = false;
  function tick() {
    if (!active) return;
    const remaining = Math.max(0, durationMs - (now() - startAt));
    onTick(Math.ceil(remaining / 1000), remaining / durationMs);
    if (remaining <= 0) {
      active = false;
      onExpire();
    }
  }
  return {
    start() { startAt = now(); active = true; onTick(Math.ceil(durationMs / 1000), 1); },
    tick,
    stop() { active = false; },
  };
}

function wrapLines(ctx, text, maxWidth) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (line && ctx.measureText(line + ch).width > maxWidth) { lines.push(line); line = ch.trim() === '' ? '' : ch; } else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}

function drawResultCanvas(canvas, result, img) {
  const W = 1080;
  const H = 1350;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const best = result.ranking.best;
  const pct = result.ranking.percent[best.id];
  const serif = '"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif';
  const sans = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';

  ctx.fillStyle = '#e9e5db'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#c09a55'; ctx.fillRect(60, 60, W - 120, H - 120);
  ctx.fillStyle = '#1a1915'; ctx.fillRect(80, 80, W - 160, H - 160);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#c09a55'; ctx.font = '36px ' + sans;
  ctx.fillText('나와 가장 닮은 철학자', W / 2, 190);

  let size = 124;
  ctx.font = '800 ' + size + 'px ' + serif;
  while (size > 56 && ctx.measureText(best.name).width > W - 280) { size -= 4; ctx.font = '800 ' + size + 'px ' + serif; }
  ctx.fillStyle = '#f5efe2'; ctx.fillText(best.name, W / 2, 330);

  ctx.fillStyle = '#c09a55'; ctx.fillRect(180, 375, W - 360, 2);
  ctx.fillStyle = '#dbb871'; ctx.font = '800 60px ' + sans; ctx.fillText(pct + '% 닮음', W / 2, 460);
  ctx.fillStyle = 'rgba(245,239,226,0.62)'; ctx.font = '30px ' + sans; ctx.fillText(best.years + ' · ' + best.place, W / 2, 515);
  ctx.fillStyle = '#c09a55'; ctx.fillRect(180, 550, W - 360, 2);

  ctx.fillStyle = '#f5efe2'; ctx.font = '700 44px ' + serif;
  wrapLines(ctx, '“' + best.quote + '”', W - 340).slice(0, 4).forEach((line, i) => ctx.fillText(line, W / 2, 640 + i * 68));

  const cx = W / 2;
  const cy = 1030;
  if (img) {
    // 초상 이미지를 원 안에 꽉 채워(정사각형 중앙 크롭) 그린다
    const side = Math.min(img.naturalWidth || img.width, img.naturalHeight || img.height);
    const sx = ((img.naturalWidth || img.width) - side) / 2;
    const sy = ((img.naturalHeight || img.height) - side) / 2;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, 148, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(img, sx, sy, side, side, cx - 148, cy - 148, 296, 296);
    ctx.restore();
    ctx.strokeStyle = '#c09a55'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, 152, 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.strokeStyle = '#c09a55'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, 150, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 130, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#dbb871'; ctx.font = '800 150px ' + serif; ctx.fillText(best.name.charAt(0), cx, cy + 52);
  }

  ctx.fillStyle = 'rgba(245,239,226,0.62)'; ctx.font = '28px ' + sans;
  ctx.fillText('나와 닮은 철학자 찾기', W / 2, H - 130);
}

async function saveImage(result, deps) {
  // 초상 이미지를 불러온다. 실패하거나 캔버스 내보내기가 막히면 이미지 없이(이니셜 엠블럼) 만든다.
  let img = null;
  if (result.portraitUrl && deps.loadImage) {
    try { img = await deps.loadImage(result.portraitUrl); } catch (e) { img = null; }
  }
  const make = async (withImg) => {
    const canvas = deps.makeCanvas();
    (deps.draw || drawResultCanvas)(canvas, result, withImg);
    return deps.toBlob(canvas);
  };
  let blob = null;
  try { blob = await make(img); } catch (e) { blob = null; }
  if (!blob && img) blob = await make(null);
  if (!blob) throw new Error('이미지를 만들지 못했어요');
  const name = 'philosopher-match.png';
  const file = typeof File !== 'undefined' ? new File([blob], name, { type: 'image/png' }) : blob;
  const attempt = deps.share ? deps.share(file) : null;
  if (attempt) {
    try { await attempt; return 'shared'; } catch (e) { if (e && e.name === 'AbortError') return 'shared'; }
  }
  deps.download(blob, name);
  return 'downloaded';
}

  // 개발자의 의견: 내가 고른 답에 해당하는 글 목록(REBUTTALS 인덱스). auto 글은 결과 직후 팝업으로만 뜬다.

  // 최근 14일 참여: 꺾은선 그래프(SVG)
  function lineChartSvg(daily) {
    const W = 600; const H = 230; const L = 34; const R = 14; const T = 26; const B = 34;
    const max = Math.max(1, ...daily.map((d) => d.count));
    const top = max <= 4 ? max : Math.ceil(max / 4) * 4;
    const x = (i) => L + (i * (W - L - R)) / Math.max(1, daily.length - 1);
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const grid = [0, 1, 2, 3, 4].map((k) => {
      const v = (top * k) / 4;
      return '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
        '<text class="ylab" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + (Number.isInteger(v) ? v : v.toFixed(1)) + '</text>';
    }).join('');
    const pts = daily.map((d, i) => x(i) + ',' + y(d.count)).join(' ');
    const dots = daily.map((d, i) => '<circle class="pt" cx="' + x(i) + '" cy="' + y(d.count) + '" r="4"><title>' + d.date + ' · ' + d.count + '명</title></circle>' +
      (d.count > 0 ? '<text class="vlab" x="' + x(i) + '" y="' + (y(d.count) - 9) + '" text-anchor="middle">' + d.count + '</text>' : '')).join('');
    const xl = daily.map((d, i) => (i % 2 === (daily.length - 1) % 2 ? '<text class="xlab" x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + d.date.slice(5) + '</text>' : '')).join('');
    return '<svg class="line-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="최근 14일 일별 참여 수 꺾은선 그래프" xmlns="http://www.w3.org/2000/svg">' +
      grid + '<polyline class="ln" fill="none" points="' + pts + '"/>' + dots + xl + '</svg>';
  }

    state.screen = 'admin';
    state.admin = { loading: true, error: false, stats: null, rows: [], truncated: false };

      const { rows, truncated } = await fetchAllRows(state.adminToken, cfg, fetchFn);
      state.admin = { loading: false, error: false, rows, truncated, stats: aggregate(rows, Date.now(), PHILOSOPHERS, QUESTIONS) };

      state.admin = { loading: false, error: true, detail: errorDetail(e), stats: null, rows: [], truncated: false };

  function downloadCsv(kind) {
    const a = state.admin;
    if (!a || !a.stats) return;
    const stamp = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10).replace(/-/g, '');
    let text;
    let name;
    if (kind === 'group-ratio' || kind === 'group-raw') {
      const id = state.detailId;
      const p = PHILOSOPHERS.find((x) => x.id === id);
      if (!p) return;
      const rows = groupRows(id);
      if (kind === 'group-ratio') {
        text = toGroupCsv(p.name, aggregate(rows, Date.now(), PHILOSOPHERS, QUESTIONS), QUESTIONS, a.stats.total);
        name = 'philo-' + p.name + '-선택비율-' + stamp + '.csv';
      } else {
        text = toRawCsv(rows, PHILOSOPHERS);
        name = 'philo-' + p.name + '-응답원본-' + stamp + '.csv';
      }
    } else {
      text = kind === 'raw' ? toRawCsv(a.rows, PHILOSOPHERS) : toSummaryCsv(a.stats, QUESTIONS);
      name = 'philo-' + (kind === 'raw' ? '원본' : '요약') + '-' + stamp + '.csv';
    }
    window.philo.deps.download(new Blob([text], { type: 'text/csv;charset=utf-8' }), name);
  }

    const mineId = state.result ? state.result.ranking.best.id : null;
    return head + '<p class="public-total">지금까지 <b>' + d.total + '명</b>이 참여했어요.</p><div class="by-philosopher">' +
      d.list.map((x) => barRow(x.name, x.count, max, x.count + ' (' + pctText(x.count, d.total) + ')', x.id === mineId ? 'mine' : '')).join('') +
      '</div>' + (mineId ? '<p class="note-small">굵게 표시된 줄이 내 결과예요.</p>' : '') + '</section></main>';
  }

  async function openPublic() {
    if (state.screen !== 'public') state.prevScreen = state.screen;
    state.screen = 'public';
    state.publicData = { loading: true, error: false, dist: null };
    render();
    try {
      const rows = await fetchPublicCounts(cfg, fetchFn);
      state.publicData = { loading: false, error: false, dist: publicDistribution(rows, PHILOSOPHERS) };
    } catch (e) {
      state.publicData = { loading: false, error: true, detail: errorDetail(e), dist: null };
    }
    if (state.screen === 'public') render();
  }

  function toast(msg) {
    document.querySelectorAll('.toast').forEach((n) => n.remove());
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  const defaultDeps = {
    makeCanvas: () => document.createElement('canvas'),
    toBlob: (cv) => new Promise((resolve) => cv.toBlob(resolve, 'image/png')),
    share: (file) => (navigator.canShare && navigator.canShare({ files: [file] }) ? navigator.share({ files: [file], title: '나와 닮은 철학자' }) : null),
    loadImage: (url) => new Promise((resolve, reject) => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error('image load failed'));
      im.src = url;
    }),
    download: (blob, name) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
  };

  async function onSave(btn) {
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      const how = await saveImage(state.result, window.philo.deps);
      if (how === 'downloaded') toast('이미지를 저장했어요');
    } catch (e) {
      toast('이미지를 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    } finally {
      btn.disabled = false;
    }
  }

  async function onCompare() {
    const link = buildCompareLink(Array.from(state.answers), window.location);
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('clipboard unavailable');
      await navigator.clipboard.writeText(link);
      toast('링크를 복사했어요. 친구에게 보내 보세요.');
    } catch (e) {
      toast('이 링크를 복사해 친구에게 보내 주세요: ' + link);
    }
  }

  function parseHash() {
    const m = /^#a=(.*)$/.exec(window.location.hash || '');
    state.friendAnswers = m ? decodeAnswers(m[1]) : null;
  }

  function stopTimer() {
    if (timer) timer.stop();
    timer = null;
    if (tickHandle) clearInterval(tickHandle);
    tickHandle = null;
  }

  function startTimer() {
    const bar = $app.querySelector('.timer .bar i');
    const num = $app.querySelector('.timer .n');
    const box = $app.querySelector('.timer');
    timer = createTimer(TIMED_MS, nowMs, (s, ratio) => {
      bar.style.width = (ratio * 100) + '%';
      num.textContent = s;
      box.classList.toggle('urgent', s <= 3);
    }, () => commit(state.pending));
    timer.start();
    tickHandle = setInterval(() => { if (timer) timer.tick(); }, 100);
  }

  function render() {
    stopTimer();
    if (state.screen === 'start') loadParticipants();
    let html = '';
    if (state.screen === 'start') html = startHtml();
    else if (state.screen === 'quiz') html = quizHtml();
    else if (state.screen === 'admin') html = adminHtml();
    else if (state.screen === 'public') html = publicHtml();
    else html = resultHtml();
    $app.innerHTML = html + scrollCueHtml() + toTopHtml() + (modalOpen ? modalHtml() : '') + (rebuttalOpen !== null ? rebuttalModalHtml() : '') + (loginOpen ? loginModalHtml() : '');
    if (loginOpen) { const pw = document.getElementById('admin-pw'); if (pw) pw.focus(); }
    document.documentElement.scrollTop = 0;
    if (state.screen === 'quiz' && QUESTIONS[state.index].timed) startTimer();
  }

  function startQuiz() {
    state.screen = 'quiz';
    state.index = 0;
    state.answers = [];
    state.result = null;
    state.pending = null;
    lockedUntil = nowMs() + 250;
    render();
  }

  function retry() {
    rebuttalOpen = null;
    state.cueDone = false;
    state.cueStill = false;
    state.screen = 'start';
    state.index = 0;
    state.answers = [];
    state.result = null;
    render();
  }

  // 일치율을 0에서 최종 값까지 올린다(처음 결과가 나올 때만). 움직임을 줄이는 설정이면 건너뛴다.
  function animatePct() {
    const el = document.getElementById('pct-num');
    if (!el || typeof window.requestAnimationFrame !== 'function') return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const to = Number(el.textContent);
    const DUR = 900;
    let t0 = null;
    el.textContent = '0';
    const step = (t) => {
      if (t0 === null) t0 = t;
      const k = Math.min(1, (t - t0) / DUR);
      const eased = 1 - Math.pow(1 - k, 3);
      const cur = document.getElementById('pct-num');
      if (!cur) return;
      cur.textContent = String(Math.round(to * eased));
      if (k < 1) window.requestAnimationFrame(step); else cur.textContent = String(to);
    };
    window.requestAnimationFrame(step);
  }

  function finish(answers) {
    state.answers = answers.slice();
    const vector = scoreAnswers(state.answers, QUESTIONS);
    const ranking = rankPhilosophers(vector, PHILOSOPHERS);
    state.result = { vector, ranking, portraitUrl: portraitUrl(ranking.best) };
    state.screen = 'result';
    const auto = matchedRebuttals(true);
    rebuttalOpen = auto.length ? auto[0] : null; // 결과를 처음 보여 줄 때만 자동 팝업
    render();
    animatePct();
    sendResult();
  }

  // 선택지를 누르면 선택만 표시한다(화면을 다시 그리지 않으므로 타이머가 유지된다). 넘어가려면 '다음으로 이동'을 눌러야 한다.
  function selectOption(i) {
    if (state.screen !== 'quiz') return;
    state.pending = i;
    $app.querySelectorAll('.options button').forEach((b) => {
      const on = Number(b.dataset.i) === i;
      b.classList.toggle('selected', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    const next = document.getElementById('next-btn');
    if (next) next.disabled = false;
  }

  // 문항에 들어갈 때 이전에 고른 답이 있으면 미리 선택해 둔다(즉답 문항은 항상 새로 시작).
  function enterQuestion() {
    const a = state.answers[state.index];
    state.pending = !QUESTIONS[state.index].timed && typeof a === 'number' ? a : null;
  }

  function goBack() {
    if (!canGoBack()) return;
    lockedUntil = nowMs() + 250;
    state.index -= 1;
    enterQuestion();
    render();
  }

  // 현재 문항의 답을 기록하고 다음으로 넘어간다. choice가 null이면 결측(시간 초과, 선택 없음).
  function commit(choice) {
    if (state.screen !== 'quiz') return;
    lockedUntil = nowMs() + 250;
    state.answers[state.index] = choice;
    state.pending = null;
    if (state.index < QUESTIONS.length - 1) {
      state.index += 1;
      enterQuestion();
      render();
    } else {
      finish(state.answers);
    }
  }

  function goNext() {
    if (state.screen !== 'quiz' || state.pending === null) return;
    if (nowMs() < lockedUntil) return;
    commit(state.pending);
  }

  $app.addEventListener('click', (e) => {
    const el = e.target.closest('button');
    if (!el) return;
    if (el.id === 'start-btn') startQuiz();
    else if (el.id === 'privacy-btn') { modalOpen = true; render(); }
    else if (el.id === 'modal-close') { modalOpen = false; render(); }
    else if (el.dataset.rebuttal !== undefined) { rebuttalOpen = Number(el.dataset.rebuttal); renderKeepScroll(); }
    else if (el.id === 'to-top') { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (el.id === 'scroll-cue') { hideCue(); window.scrollBy({ top: Math.round(window.innerHeight * 0.8), behavior: 'smooth' }); }
    else if (el.id === 'rebuttal-close') { rebuttalOpen = null; renderKeepScroll(); }
    else if (el.dataset.i !== undefined) selectOption(Number(el.dataset.i));
    else if (el.id === 'next-btn') goNext();
    else if (el.dataset.act === 'back') goBack();
    else if (el.dataset.act === 'retry') retry();
    else if (el.dataset.act === 'save') onSave(el);
    else if (el.dataset.act === 'compare') onCompare();
    else if (el.id === 'admin-btn') { if (state.adminToken) openAdmin(); else openLogin(); }
    else if (el.id === 'admin-cancel') { loginOpen = false; loginError = ''; render(); }
    else if (el.id === 'admin-submit') submitLogin();
    else if (el.dataset.act === 'admin-refresh') openAdmin();
    else if (el.dataset.act === 'admin-logout') adminLogout();
    else if (el.dataset.act === 'admin-back') { state.screen = 'start'; state.detailId = null; render(); }
    else if (el.dataset.act === 'admin-detail') { state.detailId = el.dataset.id; render(); }
    else if (el.dataset.act === 'admin-detail-back') { state.detailId = null; render(); }
    else if (el.dataset.act === 'csv-group-ratio') downloadCsv('group-ratio');
    else if (el.dataset.act === 'csv-group-raw') downloadCsv('group-raw');
    else if (el.dataset.act === 'csv-raw') downloadCsv('raw');
    else if (el.dataset.act === 'csv-summary') downloadCsv('summary');
    else if (el.id === 'public-btn' || el.dataset.act === 'public') openPublic();
    else if (el.dataset.act === 'public-back') { state.screen = state.prevScreen === 'result' && state.result ? 'result' : 'start'; render(); }
  });
  $app.addEventListener('error', (e) => {
    const el = e.target;
    if (el && el.tagName === 'IMG' && el.dataset.pid) {
      const p = PHILOSOPHERS.find((x) => x.id === el.dataset.pid);
      if (p) el.outerHTML = emblemSvg(p);
    } else if (el && el.tagName === 'IMG' && el.classList.contains('start-photo')) {
      if (el.dataset.fallback) { const f = el.dataset.fallback; delete el.dataset.fallback; el.src = f; } else el.outerHTML = startPhotoEmpty();
    }
  }, true);
  $app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target && e.target.id === 'admin-pw') submitLogin(); });
  // 키보드: 1~4 선택, Enter 다음, ← 이전 (입력창·모달이 열려 있을 때는 쓰지 않는다)
  ['pointerdown', 'touchstart', 'wheel'].forEach((ev) => document.addEventListener(ev, stopCue, { passive: true }));
  window.addEventListener('scroll', () => { if (state.screen === 'result') { updateToTop(); if (window.scrollY > 60) hideCue(); } }, { passive: true });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && rebuttalOpen !== null) { rebuttalOpen = null; renderKeepScroll(); return; }
    if (state.screen !== 'quiz' || modalOpen || loginOpen || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if (/^[1-4]$/.test(e.key)) { e.preventDefault(); selectOption(Number(e.key) - 1); }
    else if (e.key === 'Enter') { if (t && t.id === 'next-btn') return; e.preventDefault(); goNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
  });
  document.addEventListener('visibilitychange', () => { if (timer) timer.tick(); });

  window.philo = { moreLinks: MORE_LINKS, config: cfg, fetch: (...a) => window.fetch(...a), delay: (ms) => new Promise((r) => setTimeout(r, ms)), deps: defaultDeps, rank: (v) => rankPhilosophers(v, PHILOSOPHERS), state, selectOption, goNext, startQuiz, finish, render, goBack, canGoBack, tickTimer: () => { if (timer) timer.tick(); } };
  parseHash();
  render();
})();

</script>
</body>
</html>
